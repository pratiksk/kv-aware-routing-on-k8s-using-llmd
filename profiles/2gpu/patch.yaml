# 2gpu (UNTESTED): one pod per GPU via the device plugin.
# Knobs: --gpu-memory-utilization (each pod owns its GPU, so 0.9 is safe), memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: precise-prefix-cache-routing-gpu-vllm-decode
spec:
  template:
    spec:
      containers:
        - name: modelserver
          args:
            - "Qwen/Qwen3-0.6B"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=hermes"
            - "--reasoning-parser=qwen3"
            - "--gpu-memory-utilization=0.9"
            - "--max-model-len=8192"
            - "--enable-scale-out"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models,/v1/completions/render,/v1/chat/completions/render"
            - "--tensor-parallel-size=1"
            - "--block-size=64"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","replay_endpoint":"$(KV_EVENTS_REPLAY_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@Qwen/Qwen3-0.6B"}'
            - "--shutdown-timeout=45"
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: 1
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
